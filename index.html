<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تاریخ‌نگار | ۱ نوامبر ۲۰۲۶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05060a;
        --surface: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f0f2f7;
        --muted: #9aa3b8;
        --gold: #d4af37;
        --gold-soft: #f5d97a;
        --world-blue: #3b82f6;
        --world-cyan: #22d3ee;
        --violet: #8b5cf6;
        --rose: #f43f5e;
        --emerald: #10b981;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Vazirmatn", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        line-height: 1.9;
      }

      /* ===== Background ===== */
      .bg-orbs {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.55;
        animation: float 18s ease-in-out infinite;
      }
      .orb-1 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, #1e3a8a, transparent 70%);
        top: -200px;
        right: -150px;
      }
      .orb-2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, #7f1d1d, transparent 70%);
        bottom: -150px;
        left: -100px;
        animation-delay: -6s;
      }
      .orb-3 {
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, #065f46, transparent 70%);
        top: 40%;
        left: 50%;
        transform: translateX(-50%);
        animation-delay: -12s;
        opacity: 0.35;
      }
      .orb-4 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #4c1d95, transparent 70%);
        top: 10%;
        left: 10%;
        animation-delay: -3s;
        opacity: 0.4;
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(40px, -30px) scale(1.08);
        }
        66% {
          transform: translate(-30px, 25px) scale(0.95);
        }
      }

      .grain {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* ===== Loading / Error ===== */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--bg);
        transition:
          opacity 0.6s ease,
          visibility 0.6s ease;
      }
      .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .loader-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid rgba(212, 175, 55, 0.15);
        border-top-color: var(--gold);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loader-text {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 500;
      }

      .error-screen {
        max-width: 560px;
        padding: 40px;
        margin: 20px;
        text-align: center;
        background: var(--surface);
        border: 1px solid rgba(244, 63, 94, 0.25);
        border-radius: 24px;
      }
      .error-screen .icon {
        font-size: 2.5rem;
        margin-bottom: 16px;
      }
      .error-screen h2 {
        margin-bottom: 12px;
        color: #fb7185;
      }
      .error-screen p {
        color: var(--muted);
        font-size: 0.92rem;
        margin-bottom: 14px;
        line-height: 1.9;
      }
      .error-screen code {
        direction: ltr;
        display: inline-block;
        background: rgba(255, 255, 255, 0.06);
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 0.8rem;
        word-break: break-all;
      }
      .retry-btn {
        margin-top: 12px;
        padding: 12px 28px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--gold), #b8942e);
        color: #0a0a12;
        font-weight: 800;
        font-size: 0.9rem;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.3s ease;
      }
      .retry-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
      }

      /* ===== Hero ===== */
      .hero {
        position: relative;
        padding: 100px 24px 60px;
        text-align: center;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 60% 50% at 50% 0%,
            rgba(212, 175, 55, 0.18),
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 40% at 20% 80%,
            rgba(59, 130, 246, 0.12),
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 40% at 80% 80%,
            rgba(16, 185, 129, 0.08),
            transparent 70%
          );
        pointer-events: none;
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 22px;
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid rgba(212, 175, 55, 0.35);
        color: var(--gold-soft);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 28px;
        backdrop-filter: blur(10px);
        animation: fadeUp 0.8s ease both;
      }
      .hero-badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 12px var(--gold);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.7);
        }
      }

      .hero h1 {
        font-size: clamp(2.2rem, 5.5vw, 4rem);
        font-weight: 900;
        line-height: 1.35;
        margin-bottom: 20px;
        background: linear-gradient(
          135deg,
          #fff 0%,
          var(--gold-soft) 40%,
          var(--gold) 60%,
          #fff 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation:
          fadeUp 0.8s 0.1s ease both,
          shine 6s linear infinite;
      }
      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .hero-dates {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-bottom: 26px;
        animation: fadeUp 0.8s 0.2s ease both;
      }
      .date-chip {
        padding: 12px 24px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--gold-soft);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: all 0.3s ease;
      }
      .date-chip:hover {
        border-color: rgba(212, 175, 55, 0.4);
        background: rgba(212, 175, 55, 0.06);
        transform: translateY(-3px);
      }
      .date-chip small {
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 500;
      }

      .hero p {
        max-width: 760px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(0.95rem, 2vw, 1.05rem);
        animation: fadeUp 0.8s 0.3s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== Section ===== */
      .section {
        padding: 40px 24px 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 30px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .section-icon {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 1.6rem;
        flex-shrink: 0;
      }
      .section-icon.events {
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.2),
          rgba(34, 211, 238, 0.15)
        );
        border: 1px solid rgba(59, 130, 246, 0.35);
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
      }
      .section-icon.births {
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.2),
          rgba(34, 211, 238, 0.15)
        );
        border: 1px solid rgba(16, 185, 129, 0.35);
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
      }
      .section-icon.deaths {
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.2),
          rgba(244, 63, 94, 0.15)
        );
        border: 1px solid rgba(139, 92, 246, 0.35);
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
      }
      .section-icon.observances {
        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.2),
          rgba(244, 63, 94, 0.12)
        );
        border: 1px solid rgba(212, 175, 55, 0.4);
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
      }
      .section-title h2 {
        font-size: clamp(1.4rem, 3vw, 1.9rem);
        font-weight: 800;
        margin-bottom: 4px;
      }
      .section-title p {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .section-count {
        margin-right: auto;
        padding: 5px 14px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--gold-soft);
        font-size: 0.8rem;
        font-weight: 700;
      }

      /* ===== Grids ===== */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 18px;
      }

      /* ===== Cards ===== */
      .card {
        position: relative;
        padding: 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        backdrop-filter: blur(6px);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        animation: fadeUp 0.5s ease both;
        display: flex;
        flex-direction: column;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(59, 130, 246, 0.06),
          transparent
        );
        transform: translateX(100%);
        transition: transform 0.6s ease;
        pointer-events: none;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .card:hover::before {
        transform: translateX(-100%);
      }

      .card.events {
        border-color: rgba(59, 130, 246, 0.18);
      }
      .card.events:hover {
        border-color: rgba(59, 130, 246, 0.4);
        background: rgba(59, 130, 246, 0.04);
      }

      .card.births {
        border-color: rgba(16, 185, 129, 0.18);
      }
      .card.births:hover {
        border-color: rgba(16, 185, 129, 0.4);
        background: rgba(16, 185, 129, 0.04);
      }

      .card.deaths {
        border-color: rgba(139, 92, 246, 0.18);
      }
      .card.deaths:hover {
        border-color: rgba(139, 92, 246, 0.4);
        background: rgba(139, 92, 246, 0.04);
      }

      .card.observances {
        border-color: rgba(212, 175, 55, 0.2);
      }
      .card.observances:hover {
        border-color: rgba(212, 175, 55, 0.45);
        background: rgba(212, 175, 55, 0.04);
      }

      .card-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .year-badge {
        display: inline-block;
        font-size: 0.78rem;
        font-weight: 800;
        padding: 3px 12px;
        border-radius: 8px;
        letter-spacing: 0.3px;
      }
      .events .year-badge {
        background: rgba(59, 130, 246, 0.15);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .births .year-badge {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .deaths .year-badge {
        background: rgba(139, 92, 246, 0.15);
        color: #c4b5fd;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }
      .observances .year-badge {
        background: rgba(212, 175, 55, 0.15);
        color: var(--gold-soft);
        border: 1px solid rgba(212, 175, 55, 0.3);
      }

      .tag {
        padding: 3px 11px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .tag-blue {
        background: rgba(59, 130, 246, 0.12);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .tag-green {
        background: rgba(16, 185, 129, 0.12);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .tag-purple {
        background: rgba(139, 92, 246, 0.12);
        color: #c4b5fd;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }
      .tag-gold {
        background: rgba(212, 175, 55, 0.12);
        color: var(--gold-soft);
        border: 1px solid rgba(212, 175, 55, 0.3);
      }
      .tag-cyan {
        background: rgba(34, 211, 238, 0.12);
        color: #67e8f9;
        border: 1px solid rgba(34, 211, 238, 0.3);
      }
      .tag-rose {
        background: rgba(244, 63, 94, 0.12);
        color: #fda4af;
        border: 1px solid rgba(244, 63, 94, 0.3);
      }

      .card-title {
        font-size: 1.08rem;
        font-weight: 800;
        margin-bottom: 6px;
        color: #fff;
        line-height: 1.55;
        position: relative;
        z-index: 1;
      }
      .card-title-en {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 500;
        direction: ltr;
        margin-top: 4px;
        opacity: 0.75;
      }

      .card-desc {
        font-size: 0.9rem;
        color: #c8d0e0;
        margin-top: 10px;
        position: relative;
        z-index: 1;
        flex: 1;
      }

      .card-extra {
        font-size: 0.82rem;
        color: var(--muted);
        padding: 9px 13px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
        border-right: 2px solid rgba(212, 175, 55, 0.35);
        margin-top: 12px;
        position: relative;
        z-index: 1;
      }
      .card-extra strong {
        color: var(--gold-soft);
      }

      /* ===== Empty state ===== */
      .empty-state {
        padding: 40px 28px;
        text-align: center;
        border-radius: 20px;
        background: var(--surface);
        border: 1px dashed var(--border);
      }
      .empty-state .icon {
        font-size: 2rem;
        margin-bottom: 10px;
        opacity: 0.7;
      }
      .empty-state p {
        color: var(--muted);
        font-size: 0.9rem;
        max-width: 600px;
        margin: 0 auto;
      }

      /* ===== Note ===== */
      .note-card {
        margin: 40px auto 20px;
        max-width: 1200px;
        padding: 26px 30px;
        border-radius: 20px;
        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.06),
          rgba(59, 130, 246, 0.04)
        );
        border: 1px solid rgba(212, 175, 55, 0.18);
        display: flex;
        gap: 18px;
        align-items: flex-start;
        animation: fadeUp 0.7s ease both;
      }
      .note-icon {
        font-size: 1.4rem;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .note-card p {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .note-card strong {
        color: var(--gold-soft);
      }
      .note-card ul {
        margin: 8px 0 0 0;
        padding-right: 18px;
      }
      .note-card li {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      /* ===== Footer ===== */
      footer {
        text-align: center;
        padding: 50px 24px 40px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer .line {
        width: 80px;
        height: 2px;
        margin: 0 auto 24px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        border-radius: 2px;
      }
      footer a {
        color: var(--gold-soft);
        text-decoration: none;
        direction: ltr;
        display: inline-block;
      }
      footer a:hover {
        text-decoration: underline;
      }

      /* ===== Scrollbar ===== */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(var(--gold), var(--world-blue));
        border-radius: 10px;
        border: 2px solid var(--bg);
      }

      /* ===== Responsive ===== */
      @media (max-width: 640px) {
        .hero {
          padding: 70px 18px 40px;
        }
        .section {
          padding: 30px 16px 15px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 20px;
        }
        .note-card {
          flex-direction: column;
          gap: 12px;
          padding: 22px;
          margin: 30px 16px 15px;
        }
        .section-header {
          gap: 12px;
          flex-wrap: wrap;
        }
        .section-icon {
          width: 46px;
          height: 46px;
          font-size: 1.3rem;
        }
        .section-count {
          margin-right: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">در حال بارگذاری رویدادهای ۱ نوامبر…</div>
      </div>
    </div>

    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
    </div>
    <div class="grain"></div>

    <main id="app"></main>

    <footer>
      <div class="line"></div>
      <p id="footerText">تاریخ‌نگار — روایتی گرافیکی از یک روز سرنوشت‌ساز</p>
    </footer>

    <script>
      (function () {
        "use strict";

        const DATA_URL = "./data/1_nov.json";

        // ===== Helpers =====
        const $ = (sel, ctx = document) => ctx.querySelector(sel);

        const PERSIAN_DIGITS = [
          "۰",
          "۱",
          "۲",
          "۳",
          "۴",
          "۵",
          "۶",
          "۷",
          "۸",
          "۹",
        ];
        function toPersianDigits(n) {
          if (n === null || n === undefined) return "";
          return String(n).replace(/\d/g, (d) => PERSIAN_DIGITS[+d]);
        }

        const WEEKDAY_FA = {
          Sunday: "یکشنبه",
          Monday: "دوشنبه",
          Tuesday: "سه‌شنبه",
          Wednesday: "چهارشنبه",
          Thursday: "پنجشنبه",
          Friday: "جمعه",
          Saturday: "شنبه",
        };

        const MONTH_FA = {
          Farvardin: "فروردین",
          Ordibehesht: "اردیبهشت",
          Khordad: "خرداد",
          Tir: "تیر",
          Mordad: "مرداد",
          Shahrivar: "شهریور",
          Mehr: "مهر",
          Aban: "آبان",
          Azar: "آذر",
          Dey: "دی",
          Bahman: "بهمن",
          Esfand: "اسفند",
        };

        const IMPORTANCE_FA = {
          low: "اهمیت پایین",
          medium: "اهمیت متوسط",
          high: "اهمیت بالا",
          very_high: "اهمیت بسیار بالا",
        };

        const CATEGORY_FA = {
          ancient_history: "تاریخ باستان",
          medieval_history: "تاریخ قرون وسطی",
          religious_history: "تاریخ مذهبی",
          art_history: "تاریخ هنر",
          exploration_history: "تاریخ اکتشافات",
          natural_disaster: "بلای طبیعی",
          disaster: "فاجعه",
          political_history: "تاریخ سیاسی",
          political_thought: "اندیشه سیاسی",
          social_history: "تاریخ اجتماعی",
          military_history: "تاریخ نظامی",
          science_history: "تاریخ علم",
          sports_history: "تاریخ ورزش",
          engineering_history: "تاریخ مهندسی",
          cultural_history: "تاریخ فرهنگی",
          economic_history: "تاریخ اقتصادی",
          birth: "زادروز",
          death: "درگذشت",
          religious_observance: "مناسبت مذهبی",
          cultural_observance: "مناسبت فرهنگی",
          national_observance: "مناسبت ملی",
          regional_observance: "مناسبت منطقه‌ای",
          international_observance: "مناسبت بین‌المللی",
        };

        // Category tag colors per section
        const CATEGORY_CLASS = {
          // events
          ancient_history: "tag-cyan",
          medieval_history: "tag-blue",
          religious_history: "tag-purple",
          art_history: "tag-gold",
          exploration_history: "tag-cyan",
          natural_disaster: "tag-rose",
          disaster: "tag-rose",
          political_history: "tag-blue",
          political_thought: "tag-blue",
          social_history: "tag-green",
          military_history: "tag-rose",
          science_history: "tag-cyan",
          sports_history: "tag-green",
          engineering_history: "tag-cyan",
          cultural_history: "tag-gold",
          economic_history: "tag-green",
          // observances
          religious_observance: "tag-purple",
          cultural_observance: "tag-gold",
          national_observance: "tag-blue",
          regional_observance: "tag-green",
          international_observance: "tag-cyan",
        };

        function escapeHtml(str) {
          if (str === null || str === undefined) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function sortByYear(items) {
          return items.slice().sort((a, b) => {
            const ya = a.year === null || a.year === undefined ? 99999 : a.year;
            const yb = b.year === null || b.year === undefined ? 99999 : b.year;
            return ya - yb;
          });
        }

        // ===== Card renderer =====
        function renderCard(item, sectionKey, sectionIcon) {
          const yearLabel =
            item.year === null || item.year === undefined
              ? "سالانه"
              : toPersianDigits(item.year);

          const catLabel = CATEGORY_FA[item.category] || item.category || "";
          const catClass = CATEGORY_CLASS[item.category] || "tag-blue";
          const impLabel = IMPORTANCE_FA[item.importance] || "";

          let impClass = "tag-blue";
          if (item.importance === "very_high" || item.importance === "high")
            impClass = "tag-gold";
          if (item.importance === "low") impClass = "tag-cyan";

          return `
      <article class="card ${sectionKey}">
        <div class="card-meta">
          <span class="year-badge">${yearLabel}</span>
          ${catLabel ? `<span class="tag ${catClass}">${escapeHtml(catLabel)}</span>` : ""}
          ${impLabel ? `<span class="tag ${impClass}">${escapeHtml(impLabel)}</span>` : ""}
        </div>
        <h3 class="card-title">
          ${sectionIcon} ${escapeHtml(item.title || "")}
          ${item.title_en ? `<span class="card-title-en">${escapeHtml(item.title_en)}</span>` : ""}
        </h3>
        ${item.description ? `<p class="card-desc">${escapeHtml(item.description)}</p>` : ""}
        ${item.official_status ? `<div class="card-extra"><strong>وضعیت رسمی:</strong> ${escapeHtml(item.official_status)}</div>` : ""}
      </article>
    `;
        }

        // ===== Section renderer =====
        function renderSection(config) {
          const { key, title, subtitle, icon, items } = config;
          const count = items.length;

          let body;
          if (count === 0) {
            body = `
        <div class="empty-state">
          <div class="icon">${icon}</div>
          <p>در این بخش برای این روز داده‌ای ثبت نشده است.</p>
        </div>`;
          } else {
            const sorted = sortByYear(items);
            body = `<div class="grid">${sorted.map((it) => renderCard(it, key, icon)).join("")}</div>`;
          }

          return `
      <section class="section" id="${key}">
        <div class="section-header">
          <div class="section-icon ${key}">${icon}</div>
          <div class="section-title">
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(subtitle)}</p>
          </div>
          <span class="section-count">${toPersianDigits(count)} مورد</span>
        </div>
        ${body}
      </section>
    `;
        }

        // ===== Hero =====
        function renderHero(data) {
          const g = data.gregorian_date || {};
          const s = data.solar_hijri_date || {};
          const wd = WEEKDAY_FA[data.weekday] || data.weekday || "";
          const monthFa = MONTH_FA[s.month] || s.month || "";
          const meta = data.metadata || {};

          return `
      <header class="hero">
        <div class="hero-badge">
          <span class="dot"></span>
          تقویم تاریخی | یک روز
        </div>
        <h1>${toPersianDigits(g.day)} نوامبر ${toPersianDigits(g.year)}</h1>
        <div class="hero-dates">
          ${wd ? `<span class="date-chip">${escapeHtml(wd)}<small>روز هفته</small></span>` : ""}
          <span class="date-chip">
            ${toPersianDigits(g.day)} نوامبر ${toPersianDigits(g.year)}
            <small>میلادی</small>
          </span>
          <span class="date-chip">
            ${toPersianDigits(s.day)} ${escapeHtml(monthFa)} ${toPersianDigits(s.year)}
            <small>شمسی</small>
          </span>
        </div>
        <p>${escapeHtml(meta.description || "رویدادها، زادروزها، درگذشت‌ها و مناسبت‌های این روز.")}</p>
      </header>
    `;
        }

        // ===== Notes =====
        function renderNotes(meta) {
          if (!meta) return "";
          const notes = meta.editorial_notes || [];
          const note = meta.note;
          if (!notes.length && !note) return "";

          const notesHtml = notes.length
            ? `<ul>${notes.map((n) => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`
            : "";

          return `
      <div class="note-card">
        <div class="note-icon">📌</div>
        <div>
          <p><strong>یادداشت تحریریه:</strong></p>
          ${note ? `<p style="margin-top:6px;">${escapeHtml(note)}</p>` : ""}
          ${notesHtml}
        </div>
      </div>
    `;
        }

        // ===== App =====
        function renderApp(data) {
          const app = $("#app");

          const sections = [
            {
              key: "events",
              title: "رویدادها",
              subtitle: "رویدادهای تاریخی ثبت‌شده برای این روز",
              icon: "📅",
              items: data.events || [],
            },
            {
              key: "births",
              title: "زادروزها",
              subtitle: "شخصیت‌هایی که در این روز متولد شده‌اند",
              icon: "🎂",
              items: data.births || [],
            },
            {
              key: "deaths",
              title: "درگذشت‌ها",
              subtitle: "شخصیت‌هایی که در این روز درگذشته‌اند",
              icon: "🕯️",
              items: data.deaths || [],
            },
            {
              key: "observances",
              title: "مناسبت‌ها",
              subtitle: "مناسبت‌ها، تعطیلات و یادبودهای این روز",
              icon: "🏛️",
              items: data.observances || [],
            },
          ];

          app.innerHTML = `
      ${renderHero(data)}
      ${sections.map(renderSection).join("")}
      ${renderNotes(data.metadata)}
    `;

          const ft = $("#footerText");
          if (ft) {
            const g = data.gregorian_date || {};
            ft.innerHTML = `تاریخ‌نگار — ${toPersianDigits(g.day)} نوامبر ${toPersianDigits(g.year)} | منبع: <a href="${escapeHtml(DATA_URL)}" target="_blank" rel="noopener">${escapeHtml(DATA_URL)}</a>`;
          }

          const loader = $("#loadingScreen");
          if (loader) loader.classList.add("hidden");
        }

        // ===== Error =====
        function renderError(message, detail) {
          const loader = $("#loadingScreen");
          if (!loader) return;
          loader.innerHTML = `
      <div class="error-screen">
        <div class="icon">⚠️</div>
        <h2>خطا در بارگذاری داده‌ها</h2>
        <p>${escapeHtml(message)}</p>
        ${detail ? `<p style="font-size:0.82rem;opacity:0.8;">جزئیات: <code>${escapeHtml(detail)}</code></p>` : ""}
        <p style="font-size:0.82rem;">آدرس منبع:<br><code>${escapeHtml(DATA_URL)}</code></p>
        <p style="font-size:0.82rem;margin-top:12px;">
          اگر خطای CORS مشاهده می‌کنید، باید سرور شما هدر
          <code>Access-Control-Allow-Origin</code> را تنظیم کند
          یا فایل JSON روی همان دامنه‌ای میزبانی شود که صفحه در آن قرار دارد.
        </p>
        <button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>
      </div>
    `;
        }

        // ===== Fetch =====
        async function load() {
          try {
            const res = await fetch(DATA_URL, { cache: "no-cache" });
            if (!res.ok)
              throw new Error(`HTTP ${res.status} — ${res.statusText}`);
            const text = await res.text();
            let data;
            try {
              data = JSON.parse(text);
            } catch (parseErr) {
              throw new Error("پاسخ سرور JSON معتبر نیست. " + parseErr.message);
            }
            renderApp(data);
          } catch (err) {
            console.error(err);
            const msg =
              err && err.message
                ? "دریافت یا پردازش داده از منبع ناموفق بود. لطفاً اتصال اینترنت، دسترس‌پذیری دامنه و صحت فایل JSON را بررسی کنید."
                : "خطای ناشناخته در دریافت داده‌ها.";
            renderError(msg, err && err.message);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", load);
        } else {
          load();
        }
      })();
    </script>
  </body>
</html>
